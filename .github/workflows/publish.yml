name: Publish Package to NPM

on:
  push:
    branches:
      - main
    paths:
      - 'packages/react-datekit/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM distribution tag (e.g. staging, latest, beta)'
        required: true
        default: 'staging'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      - name: Check if Version Already Exists on NPM
        id: check_version
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/react-datekit/package.json').version")
          echo "Checking if react-datekit@$PACKAGE_VERSION exists on npm..."
          
          # Query npm for existing versions
          EXISTS=$(npm view "react-datekit@$PACKAGE_VERSION" version --silent || true)
          
          if [ "$EXISTS" = "$PACKAGE_VERSION" ]; then
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning ::react-datekit@$PACKAGE_VERSION is already published on npm. Skipping staging."
          else
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            echo "react-datekit@$PACKAGE_VERSION is not yet published. Proceeding..."
          fi

      - name: Build Package
        if: steps.check_version.outputs.version_exists == 'false'
        run: pnpm build

      - name: Publish Package to NPM (Staged)
        if: steps.check_version.outputs.version_exists == 'false'
        run: |
          cd packages/react-datekit
          npm publish --stage --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.STAGGING_NPM_KEY }}


